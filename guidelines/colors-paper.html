<!-- @dsCard group="Colors" viewport="700x150" name="Paper neutrals" subtitle="Warm cream surfaces & borders" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
 body{margin:0;background:var(--surface-page);font-family:var(--font-body)}
 .row{display:flex;gap:0;padding:20px}
 .sw{flex:1;display:flex;flex-direction:column}
 .chip{height:64px;border-radius:10px;border:1px solid rgba(0,0,0,.06)}
 .n{font-size:11px;font-weight:600;color:var(--text-strong);margin-top:8px}
 .h{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:2px}
 .cell{flex:1;padding:0 6px}
</style></head><body>
<div class="row">
 <div class="cell"><div class="chip" style="background:var(--cream-50)"></div><div class="n">cream-50</div><div class="h">#fffdf7</div></div>
 <div class="cell"><div class="chip" style="background:var(--cream-100)"></div><div class="n">cream-100</div><div class="h">#f6efe0</div></div>
 <div class="cell"><div class="chip" style="background:var(--cream-200)"></div><div class="n">cream-200</div><div class="h">#f1e7d2</div></div>
 <div class="cell"><div class="chip" style="background:var(--cream-300)"></div><div class="n">cream-300</div><div class="h">#ece0c6</div></div>
 <div class="cell"><div class="chip" style="background:var(--cream-400)"></div><div class="n">cream-400</div><div class="h">#e6d9bf</div></div>
 <div class="cell"><div class="chip" style="background:var(--cream-500)"></div><div class="n">cream-500</div><div class="h">#e0d2b6</div></div>
</div>
</body></html>
