<!-- @dsCard group="Brand" viewport="700x150" name="Sticker tags" subtitle="Outline + dot + hard shadow" -->
<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
 body{margin:0;background:var(--surface-page);font-family:var(--font-body)}
 .row{display:flex;gap:10px;padding:30px;flex-wrap:wrap;align-items:center}
 .tag{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;line-height:1;background:var(--surface-card);padding:7px 12px;border-radius:var(--radius-pill);box-shadow:0 2px 0 rgba(0,0,0,.10)}
 .dot{width:8px;height:8px;border-radius:50%}
</style></head><body>
<div class="row">
 <span class="tag" style="color:#5c5b54;border:1.5px solid var(--cat-general)"><span class="dot" style="background:var(--cat-general)"></span>Общее</span>
 <span class="tag" style="color:var(--cat-it);border:1.5px solid var(--cat-it)"><span class="dot" style="background:var(--cat-it)"></span>IT</span>
 <span class="tag" style="color:var(--cat-kids);border:1.5px solid var(--cat-kids)"><span class="dot" style="background:var(--cat-kids)"></span>Детская</span>
 <span class="tag" style="color:var(--cat-games);border:1.5px solid var(--cat-games)"><span class="dot" style="background:var(--cat-games)"></span>Игры</span>
</div>
</body></html>
