<div class="row">
 <div class="cell"><div class="chip" style="background:var(--terracotta)"></div><div class="n">terracotta</div><div class="h">#c26a4a</div></div>
 <div class="cell"><div class="chip" style="background:var(--terracotta-ink)"></div><div class="n">terracotta-ink</div><div class="h">#a8593d</div></div>
 <div class="cell"><div class="chip" style="background:var(--sage)"></div><div class="n">sage</div><div class="h">#7d8b6a</div></div>
</div>
