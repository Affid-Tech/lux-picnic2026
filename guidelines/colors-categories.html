<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
 body{margin:0;background:var(--surface-page);font-family:var(--font-body)}
 .row{display:flex;padding:20px;gap:14px}
 .chip{height:70px;border-radius:12px;display:flex;align-items:flex-end;padding:10px;box-sizing:border-box}
 .dot{width:12px;height:12px;border-radius:50%;background:#fff}
 .n{font-size:12px;font-weight:600;color:var(--text-strong);margin-top:9px}
 .h{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:2px}
 .cell{flex:1}
</style></head><body>
<div class="row">
 <div class="cell"><div class="chip" style="background:var(--cat-general)"><span class="dot"></span></div><div class="n">Общее</div><div class="h">#888780 · general</div></div>
 <div class="cell"><div class="chip" style="background:var(--cat-it)"><span class="dot"></span></div><div class="n">IT</div><div class="h">#2A78D6 · it</div></div>
 <div class="cell"><div class="chip" style="background:var(--cat-kids)"><span class="dot"></span></div><div class="n">Детская</div><div class="h">#E0642A · kids</div></div>
 <div class="cell"><div class="chip" style="background:var(--cat-games)"><span class="dot"></span></div><div class="n">Игры</div><div class="h">#6B62C0 · games</div></div>
</div>
</body></html>
