<!-- @dsCard group="Brand" viewport="400x170" name="Event card anatomy" subtitle="Serif time · dashed rule · sticker" -->
<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
 body{margin:0;background:var(--surface-page);font-family:var(--font-body)}
 .wrap{padding:22px}
 .card{display:flex;gap:14px;padding:16px;background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-card)}
 .time{font-family:var(--font-display);font-weight:600;font-size:18px;line-height:1;color:var(--text-strong)}
 .dur{font-weight:500;font-size:10px;color:var(--text-mono);margin-top:3px}
 .body{border-left:1px dashed var(--border-dashed);padding-left:14px;flex:1}
 .tag{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:11px;line-height:1;color:var(--cat-it);background:var(--surface-card);border:1.5px solid var(--cat-it);padding:5px 9px;border-radius:var(--radius-pill);box-shadow:0 2px 0 rgba(0,0,0,.10);margin-bottom:8px}
 .dot{width:6px;height:6px;border-radius:50%;background:var(--cat-it)}
 h3{margin:0 0 4px;font-weight:600;font-size:16px;line-height:1.25;color:var(--text-strong)}
 p{margin:0;font-size:13px;color:var(--text-muted)}
</style></head><body>
<div class="wrap">
 <div class="card">
  <div style="text-align:center"><div class="time">13:00</div><div class="dur">1 ч</div></div>
  <div class="body">
   <span class="tag"><span class="dot"></span>IT</span>
   <h3>IT-панель: карьера в эмиграции</h3>
   <p>Сцена А · 4 спикера</p>
  </div>
 </div>
</div>
</body></html>
