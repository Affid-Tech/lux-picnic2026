<!-- @dsCard group="Spacing" viewport="700x170" name="Tactile shadows" subtitle="Hard offset, little/no blur" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
 body{margin:0;background:var(--surface-page);font-family:var(--font-body)}
 .row{display:flex;gap:26px;padding:26px}
 .cell{text-align:center}
 .box{width:120px;height:60px;background:var(--surface-card);border:1px solid var(--cream-400);border-radius:var(--radius-lg)}
 .n{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:12px}
</style></head><body>
<div class="row">
 <div class="cell"><div class="box" style="box-shadow:var(--shadow-card)"></div><div class="n">--shadow-card</div></div>
 <div class="cell"><div class="box" style="box-shadow:0 2px 0 rgba(0,0,0,.10)"></div><div class="n">sticker (per-cat tint)</div></div>
 <div class="cell"><div class="box" style="box-shadow:var(--shadow-screen)"></div><div class="n">--shadow-screen</div></div>
</div>
</body></html>
