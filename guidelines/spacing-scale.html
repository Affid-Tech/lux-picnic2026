<!-- @dsCard group="Spacing" viewport="700x220" name="Spacing scale" subtitle="4 → 32, gutter 22" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
 body{margin:0;background:var(--surface-page);font-family:var(--font-body)}
 .wrap{padding:22px;display:flex;flex-direction:column;gap:9px}
 .r{display:flex;align-items:center;gap:12px}
 .bar{height:14px;background:var(--terracotta);border-radius:3px}
 .n{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);width:120px}
</style></head><body>
<div class="wrap">
 <div class="r"><span class="n">--space-1 · 4</span><div class="bar" style="width:4px"></div></div>
 <div class="r"><span class="n">--space-2 · 8</span><div class="bar" style="width:8px"></div></div>
 <div class="r"><span class="n">--space-3 · 12</span><div class="bar" style="width:12px"></div></div>
 <div class="r"><span class="n">--space-4 · 16</span><div class="bar" style="width:16px"></div></div>
 <div class="r"><span class="n">--space-5 · 20</span><div class="bar" style="width:20px"></div></div>
 <div class="r"><span class="n">--space-6 · 22 (gutter)</span><div class="bar" style="width:22px"></div></div>
 <div class="r"><span class="n">--space-7 · 28</span><div class="bar" style="width:28px"></div></div>
 <div class="r"><span class="n">--space-8 · 32</span><div class="bar" style="width:32px"></div></div>
</div>
</body></html>
