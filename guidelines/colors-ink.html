<!-- @dsCard group="Colors" viewport="700x150" name="Warm ink" subtitle="Text tones on paper" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
 body{margin:0;background:var(--surface-page);font-family:var(--font-body)}
 .row{display:flex;padding:20px}
 .chip{height:64px;border-radius:10px;border:1px solid rgba(0,0,0,.06)}
 .n{font-size:11px;font-weight:600;color:var(--text-strong);margin-top:8px}
 .h{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:2px}
 .cell{flex:1;padding:0 6px}
</style></head><body>
<div class="row">
 <div class="cell"><div class="chip" style="background:var(--brown-900)"></div><div class="n">brown-900</div><div class="h">#3a2c1c</div></div>
 <div class="cell"><div class="chip" style="background:var(--brown-700)"></div><div class="n">brown-700</div><div class="h">#6b5d47</div></div>
 <div class="cell"><div class="chip" style="background:var(--brown-500)"></div><div class="n">brown-500</div><div class="h">#9c8d6f</div></div>
 <div class="cell"><div class="chip" style="background:var(--brown-400)"></div><div class="n">brown-400</div><div class="h">#a2926f</div></div>
 <div class="cell"><div class="chip" style="background:var(--brown-300)"></div><div class="n">brown-300</div><div class="h">#b3a685</div></div>
 <div class="cell"><div class="chip" style="background:var(--paper-text);border:1px solid var(--cream-400)"></div><div class="n">paper-text</div><div class="h">#e9dcc4</div></div>
</div>
</body></html>
